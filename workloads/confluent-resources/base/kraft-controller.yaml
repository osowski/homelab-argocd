apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  # Single replica for homelab minimal deployment
  replicas: 1

  # Image configuration - defaults to latest from operator
  image:
    application: docker.io/confluentinc/cp-server:7.8.0
    init: docker.io/confluentinc/confluent-init-container:2.10.0

  # Data storage configuration
  dataVolumeCapacity: 10Gi

  # Resource configuration for KRaft controller
  podTemplate:
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 2Gi

    # Pod metadata
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
