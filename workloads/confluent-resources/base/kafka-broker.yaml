apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  # Single broker for homelab minimal deployment
  replicas: 1

  # Image configuration - defaults to latest from operator
  image:
    application: docker.io/confluentinc/cp-server:7.8.0
    init: docker.io/confluentinc/confluent-init-container:2.10.0

  # Data storage configuration
  dataVolumeCapacity: 50Gi

  # Metrics reporter disabled for minimal deployment
  metricReporter:
    enabled: false

  # Resource configuration for Kafka broker
  podTemplate:
    resources:
      requests:
        cpu: 2000m
        memory: 4Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Pod metadata
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true

  # Dependencies - must wait for KRaft controller
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller

  # Listeners configuration
  listeners:
    internal:
      authentication:
        type: plain
      tls:
        enabled: false
