apiVersion: platform.confluent.io/v1beta1
kind: CMFRestClass
metadata:
  name: cmf-rest-class
  namespace: flink
spec:
  # CMF service endpoint
  # CMF is deployed in the operator namespace
  endpoint: http://cmf-service.operator.svc.cluster.local:8080

  # Authentication configuration
  # Currently using no authentication (will add mTLS in future if needed)
  authentication:
    type: none
