apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flink

resources:
  - namespace.yaml
  - cmfrestclass.yaml
  - flink-environment.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: confluent-flink
  app.kubernetes.io/managed-by: argocd
