---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Infrastructure platform components (cert-manager, longhorn, monitoring, etc.)

  # Allow sourcing from the homelab-argocd repository
  sourceRepos:
    - https://github.com/osowski/homelab-argocd.git

  # Allow deploying to all namespaces
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc

  # Infrastructure project can create cluster-scoped resources
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  # Infrastructure project can create all namespace-scoped resources
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
