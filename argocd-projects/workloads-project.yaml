---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Application workloads (user-facing applications and services)

  # Allow sourcing from the homelab-argocd repository
  sourceRepos:
    - https://github.com/osowski/homelab-argocd.git

  # Allow deploying to all namespaces
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc

  # Workloads project only allows namespace-scoped resources
  namespaceResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

  # Explicitly deny cluster-scoped resources
  clusterResourceBlacklist:
    - group: '*'
      kind: '*'
