---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "15"  # Deploy early, before other infrastructure
spec:
  project: infrastructure
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 7.7.14  # Pin to specific version (ArgoCD v2.13.x)
    chart: argo-cd
    helm:
      valueFiles:
        - $values/infrastructure/argocd/base/values.yaml
        - $values/infrastructure/argocd/overlays/portcullis/values.yaml
  - repoURL: https://github.com/osowski/homelab-argocd
    targetRevision: HEAD
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Required for CRDs
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Ignore differences in webhook CA bundles (auto-generated by ArgoCD)
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle
        - /webhooks/2/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    # Ignore auto-generated TLS secrets
    - group: ""
      kind: Secret
      name: argocd-server-tls
      jsonPointers:
        - /data
    # Ignore Ingress loadBalancer status for NodePort environments (KIND clusters)
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /status/loadBalancer
