---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"  # Deploy after cert-manager and storage
spec:
  project: infrastructure
  source:
    repoURL: oci://ghcr.io/traefik/helm/traefik
    targetRevision: 38.0.2  # Pin to specific version
    chart: traefik
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/osowski/homelab-argocd/HEAD/infrastructure/traefik/base/values.yaml
        - https://raw.githubusercontent.com/osowski/homelab-argocd/HEAD/infrastructure/traefik/overlays/portcullis/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Required for CRDs
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Ignore differences in webhook CA bundles (auto-generated)
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    # Ignore differences in auto-generated secrets
    - group: ""
      kind: Secret
      name: alertmanager-kube-prometheus-stack-alertmanager
      jsonPointers:
        - /data
